apiVersion: v1
kind: Service
metadata:
  name: octopus-manager
  namespace: default
  labels:
    app: octopus-manager
spec:
  type: ClusterIP
  selector:
    app: octopus-manager
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
# End of manager-service.yaml
