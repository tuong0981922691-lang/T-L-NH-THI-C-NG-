apiVersion: v1
kind: ServiceAccount
metadata:
  name: octopus-manager-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: octopus-manager-role
  namespace: default
rules:
  # Allow reading and scaling deployments in this namespace (least privilege)
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Allow read access to pods for status inspection
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: octopus-manager-rolebinding
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: octopus-manager-role
subjects:
  - kind: ServiceAccount
    name: octopus-manager-sa
    namespace: default
---
# End of manager-rbac.yaml
